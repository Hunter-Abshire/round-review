[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "round-review"
version = "0.1.0"
description = "Local Valorant VOD coach: Outplayed recordings -> ffmpeg frames -> Ollama vision model -> timestamped coaching report"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "click>=8.1",
  "platformdirs>=4.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "httpx>=0.27",
]

[project.scripts]
round-review = "round_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Coaching knowledge and the learned HUD glyphs are data the package must carry.
"round_review.coaching.knowledge" = ["*.json"]
"round_review.vision.templates" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: needs ffmpeg/ffprobe on PATH"]

[tool.coverage.run]
source = ["round_review"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["round_review"]
