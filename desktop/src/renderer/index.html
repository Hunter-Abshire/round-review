<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src http://127.0.0.1:*; img-src 'self' http://127.0.0.1:*; media-src http://127.0.0.1:*; style-src 'self'; script-src 'self'"
    />
    <title>round-review</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">round<span class="brand-accent">review</span></span>
      </div>
      <div class="topbar-actions">
        <button id="settings-button" class="btn ghost" title="Settings (Ctrl+,)">Settings</button>
        <button id="refresh" class="btn ghost">Refresh</button>
      </div>
    </header>

    <p id="banner" class="banner" hidden></p>

    <main>
      <section id="list-view" class="view">
        <div class="controls">
          <div class="control-group">
            <span class="control-label">Your details</span>
            <div id="context-bar" class="context-bar"></div>
          </div>
          <div class="control-group">
            <span class="control-label">How much to review</span>
            <div id="preset-picker" class="segmented"></div>
          </div>
        </div>
        <div id="hud-hint" class="hud-hint" hidden></div>
        <div id="clips" class="clips"></div>
      </section>

      <section id="settings-view" class="view settings" hidden></section>

      <section id="review-view" class="view" hidden>
        <div class="review-bar">
          <button id="back" class="btn ghost">← Clips</button>
          <h2 id="review-title"></h2>
          <div class="review-nav">
            <button id="ask-here" class="btn ghost" title="Ask about where the video is now">
              Ask about this moment
            </button>
            <button id="prev-finding" class="btn ghost" title="Previous finding (Shift+←)">
              ‹ Prev
            </button>
            <button id="next-finding" class="btn ghost" title="Next finding (Shift+→)">
              Next ›
            </button>
          </div>
        </div>

        <div class="review-grid">
          <div class="stage">
            <div class="video-wrap">
              <video id="video" controls preload="metadata"></video>
              <svg id="overlay" class="overlay" aria-hidden="true">
                <defs>
                  <marker
                    id="overlay-arrowhead"
                    viewBox="0 0 10 10"
                    refX="9"
                    refY="5"
                    markerWidth="6"
                    markerHeight="6"
                    orient="auto-start-reverse"
                  >
                    <path d="M 0 0 L 10 5 L 0 10 z" />
                  </marker>
                </defs>
              </svg>
            </div>
            <div id="timeline" class="timeline"></div>
            <div id="coverage" class="coverage-wrap"></div>
          </div>
          <aside class="side">
            <div id="side-tabs" class="side-tabs"></div>
            <div id="side-body" class="side-body"></div>
          </aside>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
